services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opsystemAPP
    ports:
      - "8000:8000"
    environment:
      APP_NAME: "${APP_NAME:-NORSU_OPS}"
      APP_ENV: "${APP_ENV:-local}"
      APP_KEY: "${APP_KEY:-base64:samplekeyformodelledger123456789012345=}"
      APP_DEBUG: "${APP_DEBUG:-true}"
      APP_URL: "${APP_URL:-http://localhost:8000}"
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
    volumes:
      - ./storage:/var/www/html/storage
      - ./database:/var/www/html/database
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/up"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: opsystemMINIO
    ports:
      - "9000:9000" # S3 API Port
      - "9001:9001" # Web Console Port
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    #   - '9000:9000' # S3 API Port
    #   - '9002:9001' # Web Console Port
    # environment:
    #   MINIO_ROOT_USER: minioadmin
    #   MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - opsystem_minio_data:/data
    command: server /data --console-address ":9001"

