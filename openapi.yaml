openapi: "3.1.0"
info:
  title: NORSU Order Payment System API
  version: "1.0.0"
  description: |
    Laravel JSON API for the NORSU Order Payment System.
    Authentication: Sanctum stateful SPA cookies.
    All authenticated endpoints require a valid session cookie and X-XSRF-TOKEN header.

servers:
  - url: "{apiUrl}/api/v1"
    description: API server
    variables:
      apiUrl:
        default: "http://localhost:8000"
        description: Set to VITE_API_URL in production

tags:
  - name: Auth
  - name: Public
  - name: Staff
  - name: Cashier
  - name: Admin
  - name: Documents
  - name: Master Data
  - name: Graduate Ledger
  - name: Law Ledger
  - name: Assessments
  - name: Settings

components:
  securitySchemes:
    sanctumCookie:
      type: apiKey
      in: header
      name: X-XSRF-TOKEN
      description: |
        Sanctum stateful SPA authentication.
        1. GET /sanctum/csrf-cookie to receive XSRF-TOKEN cookie.
        2. Send the decoded cookie value as X-XSRF-TOKEN header on all unsafe requests.
        3. Include credentials (cookies) on every request.

  schemas:
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
    ValidationError:
      type: object
      required: [message, errors]
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    PaginationMeta:
      type: object
      properties:
        current_page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        last_page:
          type: integer
    PaginationLinks:
      type: object
      properties:
        next:
          type: string
          nullable: true
        prev:
          type: string
          nullable: true
    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [admin, staff, cashier]

security:
  - sanctumCookie: []

paths:
  /auth/user:
    get:
      tags: [Auth]
      summary: Get authenticated user
      operationId: getAuthUser
      responses:
        "200":
          description: Authenticated user
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/User"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /public/opform/options:
    get:
      tags: [Public]
      summary: Get OP form select options (memberships, payment options, etc.)
      operationId: getOpFormOptions
      security: []
      responses:
        "200":
          description: Form options
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object

  /public/opform:
    post:
      tags: [Public]
      summary: Submit an Order of Payment form
      operationId: submitOpForm
      security: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [last_name, first_name]
              properties:
                last_name:
                  type: string
                first_name:
                  type: string
                middle_name:
                  type: string
                purpose:
                  type: string
                supporting_documents:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        "201":
          description: Submission created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      reference_number:
                        type: string
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"

  /public/opform/{reference}:
    get:
      tags: [Public]
      summary: Get OP form submission by reference number
      operationId: getOpFormSubmission
      security: []
      parameters:
        - name: reference
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Submission data
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /public/opform/{reference}/print:
    get:
      tags: [Public]
      summary: Print OP receipt as PDF
      operationId: printOpReceipt
      security: []
      parameters:
        - name: reference
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: PDF stream
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "404":
          description: Not found

  /public/opform/{reference}/download:
    get:
      tags: [Public]
      summary: Download OP receipt as PDF
      operationId: downloadOpReceipt
      security: []
      parameters:
        - name: reference
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: PDF download
          content:
            application/pdf:
              schema:
                type: string
                format: binary

  /public/assessmentform:
    post:
      tags: [Public]
      summary: Submit an Assessment form
      operationId: submitAssessmentForm
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "201":
          description: Submission created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      reference_number:
                        type: string
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"

  /staff/requests:
    get:
      tags: [Staff]
      summary: List staff requests
      operationId: listStaffRequests
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: per_page
          in: query
          schema:
            type: integer
            maximum: 100
        - name: search
          in: query
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
            enum: [created_at, -created_at, name, -name]
      responses:
        "200":
          description: Paginated requests
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
                  links:
                    $ref: "#/components/schemas/PaginationLinks"
        "401":
          description: Unauthenticated
        "403":
          description: Unauthorized

  /staff/requests/process:
    post:
      tags: [Staff]
      summary: Process an unprocessed request
      operationId: processStaffRequest
      responses:
        "201": { description: Request processed }
        "422": { description: Validation or workflow error }

  /staff/requests/email-recipients:
    get:
      tags: [Staff]
      summary: List Order of Payment email recipients
      operationId: listStaffEmailRecipients
      responses:
        "200": { description: Recipient list }

  /staff/requests/student-search:
    get:
      tags: [Staff]
      summary: Search students for ledger matching
      operationId: searchStaffRequestStudents
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 100 }
      responses:
        "200": { description: Up to 20 matching students }

  /staff/requests/bulk-email-op:
    post:
      tags: [Staff]
      summary: Email selected processed Orders of Payment
      operationId: bulkEmailStaffOrdersOfPayment
      responses:
        "200": { description: Email dispatch summary }
        "422": { description: Validation error }

  /staff/requests/{formInput}:
    parameters:
      - name: formInput
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Staff]
      summary: Show a staff request and processing options
      operationId: showStaffRequest
      responses:
        "200": { description: Request details }
        "404": { description: Request not found }

  /staff/requests/{formInput}/process:
    parameters:
      - name: formInput
        in: path
        required: true
        schema: { type: integer }
    post:
      tags: [Staff]
      summary: Process a route-bound request
      operationId: processRouteBoundStaffRequest
      responses:
        "201": { description: Request processed }
        "422": { description: Validation or workflow error }

  /staff/requests/{formInput}/email-op:
    parameters:
      - name: formInput
        in: path
        required: true
        schema: { type: integer }
    post:
      tags: [Staff]
      summary: Email one Order of Payment
      operationId: emailStaffOrderOfPayment
      responses:
        "200": { description: Email sent }
        "404": { description: Request is not processed }

  /staff/requests/{formInput}/details:
    parameters:
      - name: formInput
        in: path
        required: true
        schema: { type: integer }
    put:
      tags: [Staff]
      summary: Update submitted request details
      operationId: updateStaffRequestDetails
      responses:
        "200": { description: Request details updated }
        "422": { description: Validation error }

  /staff/requests/{formInput}/student:
    parameters:
      - name: formInput
        in: path
        required: true
        schema: { type: integer }
    put:
      tags: [Staff]
      summary: Match an existing student
      operationId: linkStaffRequestStudent
      responses:
        "200": { description: Student matched }
        "422": { description: Validation or workflow error }
    post:
      tags: [Staff]
      summary: Create and match a student
      operationId: createStaffRequestStudent
      responses:
        "201": { description: Student created and matched }
        "422": { description: Validation or workflow error }

  /staff/requests/{formInput}/academic-term:
    parameters:
      - name: formInput
        in: path
        required: true
        schema: { type: integer }
    put:
      tags: [Staff]
      summary: Assign an academic term
      operationId: assignStaffRequestAcademicTerm
      responses:
        "200": { description: Academic term assigned }
        "422": { description: Validation or workflow error }

  /staff/requests/{staffInput}:
    parameters:
      - name: staffInput
        in: path
        required: true
        schema: { type: integer }
    put:
      tags: [Staff]
      summary: Update staff processing fields and status
      operationId: updateStaffRequestProcessing
      responses:
        "200": { description: Processing updated }
        "422": { description: Validation error }

  /staff/requests/{staffInput}/or:
    parameters:
      - name: staffInput
        in: path
        required: true
        schema: { type: integer }
    put:
      tags: [Staff]
      summary: Correct an existing OR number
      operationId: updateStaffRequestOrNumber
      responses:
        "200": { description: OR number updated }
        "422": { description: Validation or workflow error }

  /cashier/requests:
    get:
      tags: [Cashier]
      summary: List cashier requests
      operationId: listCashierRequests
      responses:
        "200":
          description: Paginated requests
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"

  /cashier/requests/{staffInput}/payment:
    put:
      tags: [Cashier]
      summary: Update payment for a request
      operationId: updatePayment
      parameters:
        - name: staffInput
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Payment updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"

  /admin/users:
    get:
      tags: [Admin]
      summary: List users
      operationId: listUsers
      responses:
        "200":
          description: Paginated users
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/User"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
    post:
      tags: [Admin]
      summary: Create user
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, role]
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                role:
                  type: string
                  enum: [admin, staff, cashier]
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: "#/components/schemas/User"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"

  /graduate-ledger:
    get:
      tags: [Graduate Ledger]
      summary: List graduate ledger entries
      operationId: listGraduateLedger
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: per_page
          in: query
          schema:
            type: integer
            maximum: 100
        - name: search
          in: query
          schema:
            type: string
        - name: term_id
          in: query
          schema:
            type: integer
        - name: course_id
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Paginated ledger entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"

  /graduate-ledger/import:
    post:
      tags: [Graduate Ledger]
      summary: Import graduate ledger from Excel/CSV
      operationId: importGraduateLedger
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Import complete
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"

  /graduate-ledger/export:
    get:
      tags: [Graduate Ledger]
      summary: Export graduate ledger as Excel
      operationId: exportGraduateLedger
      responses:
        "200":
          description: Excel file
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary

  /law-ledger:
    get:
      tags: [Law Ledger]
      summary: List law school ledger entries
      operationId: listLawLedger
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: per_page
          in: query
          schema:
            type: integer
            maximum: 100
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Paginated ledger entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"

  /settings/profile:
    patch:
      tags: [Settings]
      summary: Update profile
      operationId: updateProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"

  /settings/password:
    put:
      tags: [Settings]
      summary: Update password
      operationId: updatePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, password, password_confirmation]
              properties:
                current_password:
                  type: string
                password:
                  type: string
                password_confirmation:
                  type: string
      responses:
        "200":
          description: Password updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
